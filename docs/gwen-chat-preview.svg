<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
  <title id="title">Gwen desktop assistant chat screen</title>
  <desc id="desc">A warm taupe WPF window with a chat panel on the left and Gwen's friendly face on a sage green panel on the right.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e6"/><stop offset="1" stop-color="#d8d6c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#766d6b" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1280" height="840" fill="#9b9090"/>
  <rect width="1280" height="37" fill="#f6f5f4"/>
  <rect y="36" width="1280" height="1" fill="#c8c6c5"/>
  <rect x="8" y="7" width="18" height="18" rx="3" fill="#dfe9e7" stroke="#8b9f99"/>
  <text x="34" y="23" font-family="Segoe UI,Arial" font-size="16" fill="#242424">Gwen</text>
  <path d="M1128 18h13m55-6v12m-4-12h8m54-2 12 14m0-14-12 14" stroke="#292929" stroke-width="1.4" fill="none"/>
  <text x="24" y="89" font-family="Segoe UI,Arial" font-size="25" font-weight="600" fill="#fffafa">Hi, I'm Gwen.</text>
  <text x="24" y="117" font-family="Segoe UI,Arial" font-size="15" fill="#fffafa">Display mode · Local model</text>
  <g font-family="Segoe UI,Arial" font-size="14">
    <rect x="713" y="71" width="140" height="41" rx="17" fill="#f1e9e8"/><text x="728" y="97" fill="#51494a">Computer mode</text>
    <rect x="864" y="71" width="153" height="41" rx="17" fill="#f7f4f3"/><text x="879" y="97" fill="#51494a">Qwen3.5 9B · Local</text>
    <rect x="1027" y="71" width="90" height="41" rx="14" fill="#514849"/><text x="1045" y="97" fill="white">Memory</text>
    <rect x="1127" y="71" width="129" height="41" rx="14" fill="#514849"/><text x="1143" y="97" fill="white">Unload model</text>
  </g>
  <rect x="24" y="141" width="635" height="591" rx="21" fill="#f5f1f0" stroke="#d2c9c8" stroke-width="1.5"/>
  <g font-family="Segoe UI,Arial" font-size="13" text-anchor="middle">
    <rect x="445" y="159" width="91" height="36" rx="14" fill="#514849"/><text x="490" y="182" fill="white">Clear chat</text>
    <rect x="547" y="159" width="93" height="36" rx="14" fill="#514849"/><text x="593" y="182" fill="white">Show chat</text>
  </g>
  <rect x="594" y="205" width="45" height="50" rx="18" fill="#514849"/>
  <text x="616" y="236" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="white">Hi</text>
  <rect x="43" y="270" width="597" height="58" rx="18" fill="#f2faf8" stroke="#a5d2c9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="59" y="305" font-family="Segoe UI,Arial" font-size="17" fill="#5e5c5c">Hi, I'm Gwen! How can I help?</text>
  <g>
    <rect x="24" y="748" width="234" height="67" rx="15" fill="#fffafa" stroke="#6d6262" stroke-width="1.4"/>
    <rect x="268" y="748" width="56" height="67" rx="14" fill="#514849"/>
    <rect x="333" y="748" width="56" height="67" rx="14" fill="#514849"/>
    <rect x="398" y="748" width="113" height="67" rx="14" fill="#514849"/>
    <rect x="520" y="748" width="61" height="67" rx="14" fill="#514849"/>
    <rect x="590" y="748" width="69" height="67" rx="14" fill="#514849"/>
    <g fill="white" font-family="Segoe UI,Arial" font-size="14" text-anchor="middle">
      <text x="296" y="789" font-size="22">♟</text><text x="361" y="789" font-size="20">⚙</text>
      <text x="454" y="789">Hold to talk</text><text x="550" y="789">Talk</text><text x="624" y="789">Send</text>
    </g>
  </g>
  <rect x="679" y="141" width="577" height="675" rx="27" fill="#8ca281"/>
  <text x="967" y="195" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="600" fill="#26372f">Gwen</text>
  <circle cx="967" cy="423" r="180" fill="url(#face)"/>
  <ellipse cx="895" cy="384" rx="15" ry="22" fill="#35423c"/>
  <ellipse cx="1039" cy="384" rx="15" ry="22" fill="#35423c"/>
  <ellipse cx="868" cy="440" rx="17" ry="8" fill="#dfc5b7"/>
  <ellipse cx="1067" cy="440" rx="17" ry="8" fill="#dfc5b7"/>
  <ellipse cx="967" cy="486" rx="43" ry="7" fill="#78615c"/>
  <text x="967" y="685" text-anchor="middle" font-family="Segoe UI,Arial" font-size="25" fill="#26372f">Here with you</text>
  <text x="967" y="714" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#31463a">Ready when you are</text>
  <text x="967" y="741" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#26372f">Voice: Idle</text>
  <text x="967" y="781" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#31463a">Hi, I'm Gwen! How can I help?</text>
</svg>
